<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Data Formatter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0f2f5;
        }
        .card {
            background-color: white;
            border-radius: 1.5rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            transition: all 0.3s ease-in-out;
        }
        .btn {
            border-radius: 0.75rem;
            font-weight: 500;
            transition: all 0.2s ease-in-out;
            box-shadow: 0 1px 3px 0 rgba(0,0,0,0.1), 0 1px 2px 0 rgba(0,0,0,0.06);
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px 0 rgba(0,0,0,0.1);
        }
        .btn-primary {
            background-color: #4f46e5;
            color: white;
        }
        .btn-primary:hover {
            background-color: #4338ca;
        }
        .btn-secondary {
            background-color: #e2e8f0;
            color: #475569;
        }
        .btn-secondary:hover {
            background-color: #cbd5e1;
        }
        .btn-danger {
            background-color: #ef4444;
            color: white;
        }
        .btn-danger:hover {
            background-color: #dc2626;
        }
        .result-item {
            display: flex;
            align-items: center;
            padding: 0.75rem 1rem;
            background-color: #f8fafc;
            border-radius: 0.75rem;
            border: 1px solid #e2e8f0;
            margin-bottom: 0.5rem;
        }
        .result-index {
            color: #64748b;
            font-weight: 600;
            margin-right: 1rem;
        }
        .result-value {
            color: #1e293b;
        }
        .fade-in {
            animation: fadeIn 0.5s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <main class="grid grid-cols-1 lg:grid-cols-2 gap-8 w-full max-w-6xl">
        <div class="card p-8 flex flex-col">
            <div class="flex items-center mb-6">
                 <div class="bg-indigo-100 text-indigo-600 p-2 rounded-lg mr-4">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" /></svg>
                 </div>
                <h1 class="text-2xl font-bold text-gray-800">Input Text</h1>
            </div>
            <textarea id="inputText" class="w-full flex-grow bg-gray-50 border border-gray-300 rounded-xl p-4 text-gray-700 focus:ring-2 focus:ring-indigo-400 focus:border-indigo-400 transition resize-none" rows="12" placeholder="Paste your data here... e.g.&#10;123, 456, 789&#10;23&#10;hello,world&#10;42"></textarea>
            <div class="grid grid-cols-2 sm:grid-cols-2 gap-4 mt-6">
                <button id="analyzeBtn" class="btn btn-primary p-3 flex items-center justify-center"><i class="fas fa-search mr-2"></i>Analyze Data</button>
                <button id="formatSingleBtn" class="btn btn-secondary p-3">Format (Single Quotes)</button>
                <button id="formatDoubleBtn" class="btn btn-secondary p-3">Format (Double Quotes)</button>
                <button id="clearBtn" class="btn btn-danger p-3 flex items-center justify-center"><i class="fas fa-trash-alt mr-2"></i>Clear</button>
            </div>
        </div>

        <div class="card p-8 flex flex-col">
             <div class="flex items-center mb-6">
                 <div class="bg-green-100 text-green-600 p-2 rounded-lg mr-4">
                     <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                 </div>
                <h1 class="text-2xl font-bold text-gray-800">Results</h1>
            </div>
            
            <div id="results-message" class="hidden bg-green-100 border border-green-200 text-green-800 px-4 py-3 rounded-xl mb-4 text-sm flex items-center">
                <i class="fas fa-check-circle mr-2"></i>
                <span id="detectionMessage"></span>
            </div>

            <div id="results-list" class="flex-grow overflow-y-auto pr-2" style="max-height: 300px;">
                <!-- Results will be dynamically inserted here -->
            </div>
            
            <div id="formatted-output-container" class="mt-6 hidden">
                <h3 class="text-lg font-semibold text-gray-700 mb-2" id="formattedOutputTitle">Formatted Output:</h3>
                <div class="relative">
                    <textarea id="formattedOutput" readonly class="w-full bg-gray-900 text-green-400 font-mono text-sm border border-gray-700 rounded-xl p-4 pr-12 focus:outline-none resize-none" rows="4"></textarea>
                    <button id="copyBtn" class="absolute top-3 right-3 text-gray-400 hover:text-white transition" title="Copy to clipboard">
                        <i class="far fa-copy fa-lg"></i>
                    </button>
                </div>
                 <p class="text-xs text-gray-500 mt-2 text-center">Click the formatted text or the icon to copy it.</p>
            </div>
        </div>
    </main>

    <script>
        const inputText = document.getElementById('inputText');
        const analyzeBtn = document.getElementById('analyzeBtn');
        const formatSingleBtn = document.getElementById('formatSingleBtn');
        const formatDoubleBtn = document.getElementById('formatDoubleBtn');
        const clearBtn = document.getElementById('clearBtn');
        const resultsMessage = document.getElementById('results-message');
        const detectionMessage = document.getElementById('detectionMessage');
        const resultsList = document.getElementById('results-list');
        const formattedOutputContainer = document.getElementById('formatted-output-container');
        const formattedOutputTitle = document.getElementById('formattedOutputTitle');
        const formattedOutput = document.getElementById('formattedOutput');
        const copyBtn = document.getElementById('copyBtn');

        let parsedData = [];

        analyzeBtn.addEventListener('click', analyzeData);
        formatSingleBtn.addEventListener('click', () => formatData("'"));
        formatDoubleBtn.addEventListener('click', () => formatData('"'));
        clearBtn.addEventListener('click', clearAll);
        copyBtn.addEventListener('click', copyToClipboard);
        formattedOutput.addEventListener('click', copyToClipboard);

        function analyzeData() {
            const text = inputText.value.trim();
            if (!text) {
                parsedData = [];
                updateResultsUI();
                return;
            }

            const lines = text.split('\n').filter(line => line.trim() !== '');
            const values = lines.flatMap(line => line.split(',').map(item => item.trim()).filter(item => item !== ''));
            
            parsedData = values;
            updateResultsUI();
        }

        function updateResultsUI() {
            resultsList.innerHTML = '';

            if (parsedData.length > 0) {
                detectionMessage.textContent = `Data dump detected! Found ${parsedData.length} values ready for processing.`;
                resultsMessage.classList.remove('hidden');

                parsedData.forEach((item, index) => {
                    const resultItem = document.createElement('div');
                    resultItem.className = 'result-item fade-in';
                    resultItem.style.animationDelay = `${index * 50}ms`;
                    resultItem.innerHTML = `
                        <span class="result-index">#${index + 1}</span>
                        <span class="result-value">${escapeHtml(item)}</span>
                    `;
                    resultsList.appendChild(resultItem);
                });
            } else {
                resultsMessage.classList.add('hidden');
                formattedOutputContainer.classList.add('hidden');
            }
        }

        function formatData(quoteType) {
            if (parsedData.length === 0) {
                analyzeData();
                if (parsedData.length === 0) return;
            }

            const formattedString = parsedData.map(item => `${quoteType}${item.replace(new RegExp(quoteType, 'g'), `\\${quoteType}`)}${quoteType}`).join(', ');
            
            formattedOutput.value = formattedString;
            formattedOutputTitle.textContent = `Formatted Output (${quoteType === "'" ? 'Single' : 'Double'} Quotes):`;
            formattedOutputContainer.classList.remove('hidden');
        }

        function clearAll() {
            inputText.value = '';
            parsedData = [];
            updateResultsUI();
            formattedOutput.value = '';
            formattedOutputContainer.classList.add('hidden');
            resultsMessage.classList.add('hidden');
        }

        function copyToClipboard() {
            if (!formattedOutput.value) return;

            const textArea = document.createElement('textarea');
            textArea.value = formattedOutput.value;
            document.body.appendChild(textArea);
            textArea.select();
            try {
                document.execCommand('copy');
                copyBtn.innerHTML = '<i class="fas fa-check text-green-500 fa-lg"></i>';
                setTimeout(() => {
                   copyBtn.innerHTML = '<i class="far fa-copy fa-lg"></i>';
                }, 1500);
            } catch (err) {
                console.error('Failed to copy text: ', err);
            }
            document.body.removeChild(textArea);
        }
        
        function escapeHtml(unsafe) {
            return unsafe
                 .replace(/&/g, "&amp;")
                 .replace(/</g, "&lt;")
                 .replace(/>/g, "&gt;")
                 .replace(/"/g, "&quot;")
                 .replace(/'/g, "&#039;");
        }

    </script>

</body>
</html>
